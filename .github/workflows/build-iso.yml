
name: Build VRON OS Bootable ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Drive downloader
        shell: pwsh
        run: |
          python -m pip install --upgrade gdown

      - name: Download Windows LTSC ISO
        shell: pwsh
        run: |
          $iso = "$env:RUNNER_TEMP\windows.iso"

          python -m gdown "1ytJHTL52L05yKz62sWn9yM8zksOkT8em" -O $iso --retries 5 --timeout 60

          if (!(Test-Path $iso)) {
            throw "Windows ISO download failed."
          }

          $size = (Get-Item $iso).Length
          Write-Host "Windows ISO size: $size bytes"

          if ($size -lt 1000000000) {
            throw "Windows ISO appears incomplete."
          }

      - name: Download VRON application
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vron.zip"

          python -m gdown "1bYtfxs2lmqWkOKQEwDPmyMd_huAmXCIF" -O $zip --retries 5 --timeout 60

          if (!(Test-Path $zip)) {
            throw "VRON ZIP download failed."
          }

          if ((Get-Item $zip).Length -lt 1000000) {
            throw "VRON ZIP appears incomplete."
          }

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress

      - name: Extract Windows ISO
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          if (!(Test-Path $sevenZip)) {
            $sevenZip = "C:\Program Files (x86)\7-Zip\7z.exe"
          }

          if (!(Test-Path $sevenZip)) {
            throw "7-Zip not found."
          }

          New-Item -ItemType Directory -Force C:\VRONBuild\ISO | Out-Null

          & $sevenZip x "$env:RUNNER_TEMP\windows.iso" "-oC:\VRONBuild\ISO" -y

          if (!(Test-Path "C:\VRONBuild\ISO\setup.exe")) {
            throw "Windows ISO extraction failed."
          }

      - name: Verify Windows installation media
        shell: pwsh
        run: |
          $source = "C:\VRONBuild\ISO"

          $required = @(
            "$source\setup.exe",
            "$source\sources\boot.wim",
            "$source\boot\etfsboot.com",
            "$source\efi\microsoft\boot\efisys.bin"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Required Windows installation file missing: $file"
            }
          }

          Write-Host "Windows installation media verified."

      - name: Extract VRON application
        shell: pwsh
        run: |
          $extract = "$env:RUNNER_TEMP\vron"

          Expand-Archive "$env:RUNNER_TEMP\vron.zip" $extract -Force

          $exe = Get-ChildItem $extract -Filter "VRON.Shell.exe" -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "VRON.Shell.exe not found."
          }

          $destination = 'C:\VRONBuild\ISO\sources\$OEM$\$1\VRON'

          New-Item -ItemType Directory -Force $destination | Out-Null

          Copy-Item "$($exe.Directory.FullName)\*" $destination -Recurse -Force

          if (!(Test-Path "$destination\VRON.Shell.exe")) {
            throw "VRON executable copy failed."
          }

          Write-Host "VRON application integrated."

      - name: Configure VRON startup
        shell: pwsh
        run: |
          $scripts = 'C:\VRONBuild\ISO\sources\$OEM$\$$\Setup\Scripts'

          New-Item -ItemType Directory -Force $scripts | Out-Null

          @'
          @echo off
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /v "VRON" /t REG_SZ /d "%SystemDrive%\VRON\VRON.Shell.exe" /f
          exit /b 0
          '@ | Set-Content "$scripts\SetupComplete.cmd" -Encoding ASCII

      - name: Install Windows ADK
        shell: pwsh
        run: |
          $installer = "$env:TEMP\adksetup.exe"

          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2196127" -OutFile $installer

          $process = Start-Process $installer `
            -ArgumentList "/quiet", "/features", "OptionId.DeploymentTools", "/norestart" `
            -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Windows ADK installation failed: $($process.ExitCode)"
          }

      - name: Verify Oscdimg
        shell: pwsh
        run: |
          $adk = "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe"

          if (!(Test-Path $adk)) {
            throw "Oscdimg not found."
          }

      - name: Build BIOS and UEFI bootable ISO
        shell: pwsh
        run: |
          $source = "C:\VRONBuild\ISO"
          $output = "C:\VRONBuild\VRON-OS-v2.0-LTSC2021.iso"

          $adk = "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe"

          & $adk -m -o -u2 -udfver102 "-bootdata:2#p0,e,b$source\boot\etfsboot.com#pEF,e,b$source\efi\microsoft\boot\efisys.bin" $source $output

          if ($LASTEXITCODE -ne 0) {
            throw "Oscdimg failed with exit code $LASTEXITCODE"
          }

          if (!(Test-Path $output)) {
            throw "ISO creation failed."
          }

          Write-Host "VRON ISO CREATED!"

      - name: Upload final ISO
        uses: actions/upload-artifact@v4
        with:
          name: VRON-OS-v2.0-LTSC2021
          path: C:\VRONBuild\VRON-OS-v2.0-LTSC2021.iso
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
