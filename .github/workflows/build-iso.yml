
name: Build VRON OS v2.0 ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python and gdown
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install download tool
        shell: pwsh
        run: |
          python -m pip install --upgrade gdown

      - name: Download Windows 10 IoT Enterprise LTSC 2021
        shell: pwsh
        run: |
          $iso = "$env:RUNNER_TEMP\windows.iso"

          $url = "https://archive.org/download/en-us_windows_10_iot_enterprise_ltsc_2021_x64_dvd_257ad90f/en-us_windows_10_iot_enterprise_ltsc_2021_x64_dvd_257ad90f.iso"

          Remove-Item $iso -Force -ErrorAction SilentlyContinue

          curl.exe -fL --retry 5 --retry-delay 5 `
            --connect-timeout 60 `
            -o $iso $url

          if ($LASTEXITCODE -ne 0 -or !(Test-Path $iso)) {
            throw "Windows ISO download failed."
          }

          $size = (Get-Item $iso).Length
          $gb = [math]::Round($size / 1GB, 2)

          Write-Host "Windows ISO downloaded: $gb GB"

          if ($size -lt 4000000000) {
            throw "Windows ISO is incomplete."
          }

      - name: Download VRON application ZIP
        shell: pwsh
        run: |
          $id = "1ytJHTL52L05yKz62sWn9yM8zksOkT8em"
          $zip = "$env:RUNNER_TEMP\vron.zip"

          python -m gdown $id -O $zip --retries 5 --timeout 120

          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) {
            throw "VRON ZIP download failed."
          }

          $size = (Get-Item $zip).Length

          Write-Host "VRON ZIP size: $size bytes"

          if ($size -lt 1000000) {
            throw "VRON ZIP is incomplete."
          }

      - name: Verify extraction tools
        shell: pwsh
        run: |
          if (!(Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw "7-Zip is not available."
          }

      - name: Extract Windows ISO
        shell: pwsh
        run: |
          $iso = "$env:RUNNER_TEMP\windows.iso"
          $source = "C:\VRONBuild\ISO"

          New-Item -ItemType Directory -Force -Path $source | Out-Null

          7z x $iso "-o$source" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Windows ISO extraction failed."
          }

          $required = @(
            "$source\setup.exe",
            "$source\sources\boot.wim",
            "$source\boot\etfsboot.com",
            "$source\efi\microsoft\boot\efisys.bin"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

          Write-Host "Windows installation media verified."

          Remove-Item $iso -Force

      - name: Extract and install VRON
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vron.zip"
          $dest = "C:\VRONBuild\VRON"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          7z x $zip "-o$dest" -y

          if ($LASTEXITCODE -ne 0) {
            throw "VRON ZIP extraction failed."
          }

          $exe = Get-ChildItem $dest -Filter "VRON.Shell.exe" -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "VRON.Shell.exe not found."
          }

          Write-Host "Found VRON: $($exe.FullName)"

          $target = "C:\VRONBuild\ISO\sources\`$OEM$\`$1\VRON"

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item "$($exe.Directory.FullName)\*" $target -Recurse -Force

          if (!(Test-Path "$target\VRON.Shell.exe")) {
            throw "VRON installation copy failed."
          }

          Write-Host "VRON application copied successfully."

          Remove-Item $zip -Force

      - name: Create SetupComplete script
        shell: pwsh
        run: |
          $dir = "C:\VRONBuild\ISO\sources\`$OEM$\`$`$\Setup\Scripts"

          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          @'
          @echo off
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /v "VRON" /t REG_SZ /d "C:\VRON\VRON.Shell.exe" /f
          exit /b 0
          '@ | Set-Content "$dir\SetupComplete.cmd" -Encoding ASCII

          Write-Host "SetupComplete script created."

      - name: Install Windows ADK Deployment Tools
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\adksetup.exe"
          $url = "https://go.microsoft.com/fwlink/?linkid=2271337"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process $installer `
            -ArgumentList "/quiet", "/norestart", "/features", "OptionId.DeploymentTools" `
            -Wait -PassThru

          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "Windows ADK installation failed: $($process.ExitCode)"
          }

          $oscdimg = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools" `
            -Filter oscdimg.exe -Recurse |
            Select-Object -First 1

          if (!$oscdimg) {
            throw "oscdimg.exe not found."
          }

          "OSCDIMG=$($oscdimg.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Windows ADK ready."

      - name: Build bootable VRON ISO
        shell: pwsh
        run: |
          $source = "C:\VRONBuild\ISO"
          $output = "C:\VRONBuild\VRON-OS-v2.0-LTSC2021.iso"

          & "$env:OSCDIMG" -m -o -u2 -udfver102 `
            "-bootdata:2#p0,e,b$source\boot\etfsboot.com#pEF,e,b$source\efi\microsoft\boot\efisys.bin" `
            $source $output

          if ($LASTEXITCODE -ne 0) {
            throw "OSCDIMG failed: $LASTEXITCODE"
          }

          if (!(Test-Path $output)) {
            throw "Final ISO was not created."
          }

          $size = [math]::Round((Get-Item $output).Length / 1GB, 2)

          Write-Host "VRON ISO CREATED: $size GB"

      - name: Upload final VRON ISO
        uses: actions/upload-artifact@v4
        with:
          name: VRON-OS-v2.0-LTSC2021
          path: C:\VRONBuild\VRON-OS-v2.0-LTSC2021.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
