
name: Build VRON OS v2.0 ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install download tool
        shell: pwsh
        run: |
          python -m pip install --upgrade pip gdown

      - name: Download Windows ISO
        shell: pwsh
        run: |
          $id = "1ytJHTL52L05yKz62sWn9yM8zksOkT8em"
          $iso = "$env:RUNNER_TEMP\windows.iso"

          python -m gdown "https://drive.google.com/uc?id=$id" -O $iso --fuzzy --retries 5 --timeout 120

          if (!(Test-Path $iso)) {
            throw "Windows ISO download failed."
          }

          $size = (Get-Item $iso).Length
          Write-Host "Windows ISO size: $size bytes"

          if ($size -lt 4000000000) {
            throw "Windows ISO incomplete. Expected approximately 4.7 GB."
          }

      - name: Download VRON application
        shell: pwsh
        run: |
          $id = "1bYtfxs2lmqWkOKQEwDPmyMd_huAmXCIF"
          $zip = "$env:RUNNER_TEMP\vron.zip"

          python -m gdown "https://drive.google.com/uc?id=$id" -O $zip --fuzzy --retries 5 --timeout 120

          if (!(Test-Path $zip)) {
            throw "VRON application download failed."
          }

          if ((Get-Item $zip).Length -lt 1000000) {
            throw "VRON ZIP appears incomplete."
          }

      - name: Extract Windows ISO
        shell: pwsh
        run: |
          $iso = "$env:RUNNER_TEMP\windows.iso"
          $source = "C:\VRONBuild\ISO"

          New-Item -ItemType Directory -Force -Path $source | Out-Null

          7z x $iso "-o$source" -y

          if (!(Test-Path "$source\setup.exe")) {
            throw "Windows ISO extraction failed: setup.exe missing."
          }

          if (!(Test-Path "$source\sources\boot.wim")) {
            throw "Windows boot.wim missing."
          }

          if (!(Test-Path "$source\boot\etfsboot.com")) {
            throw "BIOS boot file missing."
          }

          if (!(Test-Path "$source\efi\microsoft\boot\efisys.bin")) {
            throw "UEFI boot file missing."
          }

      - name: Extract VRON application
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vron.zip"
          $dest = "C:\VRONBuild\VRON"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          7z x $zip "-o$dest" -y

          $exe = Get-ChildItem $dest -Filter "VRON.Shell.exe" -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "VRON.Shell.exe not found in downloaded ZIP."
          }

          Write-Host "Found VRON executable: $($exe.FullName)"

          $appFolder = $exe.Directory.FullName
          $target = "C:\VRONBuild\ISO\sources\`$OEM$\`$1\VRON"

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item "$appFolder\*" $target -Recurse -Force

          if (!(Test-Path "$target\VRON.Shell.exe")) {
            throw "VRON copy verification failed."
          }

      - name: Create Windows SetupComplete script
        shell: pwsh
        run: |
          $scriptDir = "C:\VRONBuild\ISO\sources\`$OEM$\`$`$\Setup\Scripts"

          New-Item -ItemType Directory -Force -Path $scriptDir | Out-Null

          @'
          @echo off
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /v "VRON" /t REG_SZ /d "C:\VRON\VRON.Shell.exe" /f
          exit /b 0
          '@ | Set-Content "$scriptDir\SetupComplete.cmd" -Encoding ASCII

      - name: Install Windows ADK Deployment Tools
        shell: pwsh
        run: |
          $url = "https://download.microsoft.com/download/2/0/9/209b7c9e-4b3a-4f16-a0c9-2d5c5f4a4f2d/adksetup.exe"
          $installer = "$env:RUNNER_TEMP\adksetup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process $installer -ArgumentList "/quiet", "/norestart", "/features", "OptionId.DeploymentTools" -Wait

          $oscdimg = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools" -Filter oscdimg.exe -Recurse |
            Select-Object -First 1

          if (!$oscdimg) {
            throw "Windows ADK oscdimg.exe not found."
          }

          "OSCDIMG=$($oscdimg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build VRON bootable ISO
        shell: pwsh
        run: |
          $source = "C:\VRONBuild\ISO"
          $output = "C:\VRONBuild\VRON-OS-v2.0-LTSC2021.iso"

          & "$env:OSCDIMG" -m -o -u2 -udfver102 `
            "-bootdata:2#p0,e,b$source\boot\etfsboot.com#pEF,e,b$source\efi\microsoft\boot\efisys.bin" `
            $source $output

          if ($LASTEXITCODE -ne 0) {
            throw "OSCDIMG failed with exit code $LASTEXITCODE"
          }

          if (!(Test-Path $output)) {
            throw "Final ISO was not created."
          }

          Write-Host "VRON ISO created successfully."

      - name: Upload VRON ISO
        uses: actions/upload-artifact@v4
        with:
          name: VRON-OS-v2.0-LTSC2021
          path: C:\VRONBuild\VRON-OS-v2.0-LTSC2021.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
