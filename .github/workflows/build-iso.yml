name: Build VRON OS v2.0 ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python and gdown
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install download tool
        shell: pwsh
        run: |
          python -m pip install --upgrade gdown

      - name: Download Windows ISO
        shell: pwsh
        run: |
          $iso = "$env:RUNNER_TEMP\windows.iso"
          # Archive.org থেকে উইন্ডোজ ১০ আইওটি এন্টারপ্রাইজ এলটিএসসি ২০২১ এর ডিরেক্ট লিংক
          $url = "https://archive.org/download/en-us_windows_10_iot_enterprise_ltsc_2021_x64_dvd_257ad90f/en-us_windows_10_iot_enterprise_ltsc_2021_x64_dvd_257ad90f.iso"

          curl.exe -L --retry 5 --retry-delay 5 -o $iso $url

          if ($LASTEXITCODE -ne 0 -or !(Test-Path $iso)) {
            throw "Windows ISO download failed."
          }

          $size = (Get-Item $iso).Length
          Write-Host "Windows ISO size: $size bytes"

          if ($size -lt 4000000000) {
            throw "Incomplete Windows ISO download."
          }

      - name: Download VRON application
        shell: pwsh
        run: |
          $id = "1bYtfxs2lmqWkOKQEwDPmyMd_huAmXCIF"
          $zip = "$env:RUNNER_TEMP\vron.zip"

          python -m gdown $id -O $zip --retries 5 --timeout 120

          if ($LASTEXITCODE -ne 0 -or !(Test-Path $zip)) {
            throw "VRON ZIP download failed."
          }

          if ((Get-Item $zip).Length -lt 1000000) {
            throw "VRON ZIP appears incomplete."
          }

      - name: Extract Windows ISO
        shell: pwsh
        run: |
          $iso = "$env:RUNNER_TEMP\windows.iso"
          $source = "C:\VRONBuild\ISO"

          New-Item -ItemType Directory -Force -Path $source | Out-Null

          7z x $iso "-o$source" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Windows ISO extraction failed."
          }

          $required = @(
            "$source\setup.exe",
            "$source\sources\boot.wim",
            "$source\boot\etfsboot.com",
            "$source\efi\microsoft\boot\efisys.bin"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing Windows ISO file: $file"
            }
          }

      - name: Extract and install VRON files
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vron.zip"
          $dest = "C:\VRONBuild\VRON"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          7z x $zip "-o$dest" -y

          if ($LASTEXITCODE -ne 0) {
            throw "VRON ZIP extraction failed."
          }

          $exe = Get-ChildItem $dest -Filter "VRON.Shell.exe" -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "VRON.Shell.exe not found."
          }

          $target = "C:\VRONBuild\ISO\sources\`$OEM$\`$1\VRON"

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item "$($exe.Directory.FullName)\*" $target -Recurse -Force

          if (!(Test-Path "$target\VRON.Shell.exe")) {
            throw "VRON installation copy failed."
          }

      - name: Create SetupComplete script
        shell: pwsh
        run: |
          $dir = "C:\VRONBuild\ISO\sources\`$OEM$\`$`$\Setup\Scripts"

          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          Set-Content -Path "$dir\SetupComplete.cmd" -Value '@echo off' -Encoding ASCII
          Add-Content -Path "$dir\SetupComplete.cmd" -Value 'reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /v "VRON" /t REG_SZ /d "C:\VRON\VRON.Shell.exe" /f' -Encoding ASCII
          Add-Content -Path "$dir\SetupComplete.cmd" -Value 'exit /b 0' -Encoding ASCII

      - name: Install Windows ADK
        shell: pwsh
        run: |
          $url = "https://go.microsoft.com/fwlink/?linkid=2271337"
          $installer = "$env:RUNNER_TEMP\adksetup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process $installer -ArgumentList "/quiet", "/norestart", "/features", "OptionId.DeploymentTools" -Wait

          $oscdimg = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools" -Filter oscdimg.exe -Recurse |
            Select-Object -First 1

          if (!$oscdimg) {
            throw "oscdimg.exe not found."
          }

          "OSCDIMG=$($oscdimg.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Build bootable VRON ISO
        shell: pwsh
        run: |
          $source = "C:\VRONBuild\ISO"
          $output = "C:\VRONBuild\VRON-OS-v2.0-LTSC2021.iso"

          & "$env:OSCDIMG" -m -o -u2 -udfver102 `
            "-bootdata:2#p0,e,b$source\boot\etfsboot.com#pEF,e,b$source\efi\microsoft\boot\efisys.bin" `
            $source $output

          if ($LASTEXITCODE -ne 0 -or !(Test-Path $output)) {
            throw "VRON ISO build failed."
          }

          Write-Host "VRON ISO successfully created!"

      - name: Upload final ISO
        uses: actions/upload-artifact@v4
        with:
          name: VRON-OS-v2.0-LTSC2021
          path: C:\VRONBuild\VRON-OS-v2.0-LTSC2021.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
