name: VRON OS ISO Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Windows ADK Deployment Tools
        shell: pwsh
        run: |
          $url = "https://go.microsoft.com/fwlink/?linkid=2196127"
          $installer = "$env:TEMP\adksetup.exe"

          Invoke-WebRequest $url -OutFile $installer

          Start-Process $installer `
            -ArgumentList "/quiet", "/features", "OptionId.DeploymentTools" `
            -Wait

      - name: Verify Oscdimg
        shell: pwsh
        run: |
          $oscdimg = "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe"

          if (!(Test-Path $oscdimg)) {
            throw "Oscdimg installation failed."
          }

          Write-Host "Oscdimg ready."

      - name: Prepare VRON ISO builder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\VRONBuild
          New-Item -ItemType Directory -Force C:\VRONBuild\ISO

          Copy-Item scripts\build-vron-iso.ps1 C:\VRONBuild\
          Copy-Item files\SetupComplete.cmd C:\VRONBuild\

      - name: Upload prepared builder
        uses: actions/upload-artifact@v4
        with:
          name: VRON-ISO-Builder-Prepared
          path: C:\VRONBuild\
